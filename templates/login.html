{% extends "base_auth.html" %}
{% block card %}
<h1>Welcome back</h1>
<p class="lede">Sign in to your stores, or to the demo account.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <div class="fld"><input id="email" name="email" type="email" autocomplete="email" placeholder=" " required autofocus><label for="email">Email</label></div>
  <div class="fld"><input id="password" name="password" type="password" autocomplete="current-password" placeholder=" " required><label for="password">Password</label>
    <button class="reveal" type="button" data-reveal="password" aria-pressed="false">Show</button></div>
  <button class="btn primary big wide" type="submit">Sign in</button>
</form>
{% if google_enabled %}
<div class="or">or</div>
<a class="btn big wide" href="{{ url_for('auth_google', next=next) }}">Continue with Google</a>
{% endif %}
{% if demo_one_click %}
<div class="or">or</div>
<form method="post" action="{{ url_for('demo') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="btn big wide" type="submit">Open the demo stores</button></form>
{% endif %}
<p class="aside" style="margin-top:1.25rem">New to {{ brand }}? <a href="{{ url_for('signup') }}">Create an account</a>.</p>
{% endblock %}
