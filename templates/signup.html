{% extends "base_auth.html" %}
{% block card %}
<h1>Create your account</h1>
<p class="lede">Add a store, upload its floor plan and start comparing layouts.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="fld"><input id="name" name="name" type="text" autocomplete="name" placeholder=" " required autofocus><label for="name">Your name</label></div>
  <div class="fld"><input id="email" name="email" type="email" autocomplete="email" placeholder=" " required><label for="email">Email</label></div>
  <div class="fld"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder=" " required><label for="password">Password (8 characters or more)</label>
    <button class="reveal" type="button" data-reveal="password" aria-pressed="false">Show</button></div>
  <button class="btn primary big wide" type="submit">Create account</button>
</form>
<p class="aside" style="margin-top:1.25rem">Already have an account? <a href="{{ url_for('login') }}">Sign in</a>.</p>
{% endblock %}
