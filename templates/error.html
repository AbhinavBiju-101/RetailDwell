{% extends "base_public.html" %}
{% block content %}
<section class="auth">
  <h1>{{ 'Not found' if code == 404 else 'No access' if code == 403 else 'Something went wrong' }}</h1>
  <p class="lede">{{ message }}</p>
  <p><a class="btn" href="{{ url_for('stores') if user else url_for('landing') }}">{{ 'Back to your stores' if user else 'Back to the start' }}</a></p>
</section>
{% endblock %}
