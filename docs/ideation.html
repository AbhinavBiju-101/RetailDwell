<head>

<style>
:root{
  --bg:#ECEFF4; --side:#F5F7FA; --paper:#FFFFFF; --ink:#18212F; --muted:#5E6B7E; --line:#D9DFE8;
  --accent:#2556C4; --accent-soft:#E3EBFB; --code:#EEF1F6; --ok:#1B7A4B; --scrim:rgba(14,19,26,.45);
  --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E131A; --side:#131A23; --paper:#18202B; --ink:#E4E9F1; --muted:#97A3B6; --line:#2B3647;
  --accent:#8CAEF7; --accent-soft:#1D2B49; --code:#222C3A; --ok:#5CC48D; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
@media (min-width:52rem){.app{grid-template-columns:19.5rem minmax(0,1fr)}}
.side{display:flex;flex-direction:column;min-height:0;background:var(--side);border-right:1px solid var(--line);
  position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(20rem,86vw);transform:translateX(-102%);transition:transform .18s ease}
.nav-open .side{transform:none}
@media (min-width:52rem){.side{position:static;transform:none;width:auto}}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:none}
.nav-open .scrim{display:block}
@media (min-width:52rem){.nav-open .scrim{display:none}}
.brand{padding:1rem 1rem .75rem;display:flex;flex-direction:column;gap:.15rem}
.brand h1{margin:0;font:600 1.05rem/1.25 var(--display)}
.brand p{margin:0;font:500 .7rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.search{padding:0 1rem .6rem}
.search input{width:100%;height:2.1rem;padding:0 .7rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:.85rem}
.treehead{display:flex;justify-content:space-between;padding:.4rem 1rem .3rem;font:500 .68rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tree{flex:1;min-height:0;overflow-y:auto;padding:0 .5rem .75rem}
.tree-empty{margin:.75rem .5rem;color:var(--muted);font-size:.85rem}
.row{display:flex;align-items:center;gap:.1rem;border-radius:6px;padding-left:calc(var(--d)*1rem)}
.row:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.row.on{background:var(--accent-soft)}
.tog,.spacer{flex:none;width:1.5rem;height:2rem;display:grid;place-items:center;border:0;background:none;color:var(--muted);padding:0}
.tog svg{width:.7rem;height:.7rem;transition:transform .15s ease}
.tog[aria-expanded="true"] svg{transform:rotate(90deg)}
.name{flex:1;min-width:0;height:2rem;text-align:left;border:0;background:none;padding:0 .5rem 0 .1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.88rem;color:var(--muted)}
.row.top .name{color:var(--ink);font-weight:600}
.row.on .name{color:var(--accent);font-weight:600}
.sidefoot{display:flex;gap:.5rem;padding:.75rem 1rem;border-top:1px solid var(--line)}
.btn{height:2.1rem;padding:0 .8rem;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:.82rem;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.primary:hover{color:var(--paper);filter:brightness(1.08)}
.btn.grow{flex:1}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;border-bottom:1px solid var(--line);background:var(--side);flex-wrap:wrap}
.menu{display:inline-flex;align-items:center;justify-content:center;width:2.1rem;height:2.1rem;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
@media (min-width:52rem){.menu{display:none}}
.msg{margin-left:auto;font:500 .72rem/1 var(--mono);color:var(--ok)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-inline:16px;padding-block:1.5rem 4rem}
.paper{max-width:52rem;margin-inline:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2rem clamp(1.1rem,4vw,3.25rem) 3rem;display:flex;flex-direction:column;gap:1rem}
.crumb{margin:0;font:500 .7rem/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.paper h1.title{margin:0;font:600 clamp(1.6rem,4.6vw,2.2rem)/1.2 var(--display);text-wrap:balance}
.doc{font-size:1rem;line-height:1.68;overflow-x:auto;overflow-wrap:break-word}
.doc>*+*{margin-top:.95em}
.doc h1,.doc h2{font:600 1.55rem/1.3 var(--display);margin-top:1.8em;text-wrap:balance}
.doc h3{font:600 1.18rem/1.35 var(--display);margin-top:1.6em;text-wrap:balance}
.doc h4{font:500 .74rem/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:1.5em}
.doc ul,.doc ol{padding-left:1.5rem}
.doc li+li{margin-top:.3em}
.doc blockquote{margin-inline:0;padding:.6rem 1rem;border-left:3px solid var(--accent);background:var(--accent-soft)}
.doc code{font:400 .86em var(--mono);background:var(--code);padding:.1em .35em;border-radius:4px}
.doc pre{font:400 .84rem/1.55 var(--mono);background:var(--code);padding:.8rem 1rem;border-radius:6px;overflow-x:auto;white-space:pre}
.doc pre code{background:none;padding:0}
.doc table{border-collapse:collapse;width:100%;font-size:.88rem;line-height:1.45}
.doc th,.doc td{border:1px solid var(--line);padding:.45rem .65rem;vertical-align:top;text-align:left;min-width:7rem}
.doc th{background:var(--code);font-weight:600}
</style>
</head>

<script id="data" type="application/json">[{"title": "Other sensors", "parent": "sensors", "order": 5, "html": "<table><thead><tr><th>Approach<\/th><th>What it gives you<\/th><th>Tradeoff<\/th><\/tr><\/thead><tbody><tr><td>Shelf-level PIR or time-of-flight (a few dollars each)<\/td><td>Anonymous someone-is-at-this-shelf per section, unaffected by occlusion<\/td><td>No identity, presence only<\/td><\/tr><tr><td>mmWave radar (60 GHz modules)<\/td><td>Privacy-safe presence, motion and counting in aisles or queues, works in the dark<\/td><td>Metal shelves reflect; placement needs testing<\/td><\/tr><tr><td>Low-res thermal arrays (8x8, 32x24)<\/td><td>Cheap anonymous counting at entrances and chokepoints<\/td><td>Low resolution, short range<\/td><\/tr><tr><td>Wi-Fi sensing (CSI)<\/td><td>Device-free motion detection using existing access points<\/td><td>Research-grade, coarse, hard to demo reliably<\/td><\/tr><tr><td>Cart-mounted IMU with dead reckoning<\/td><td>Path with no receivers, corrected at landmarks<\/td><td>Drift, and covers carts only<\/td><\/tr><tr><td>Opt-in QR check-in (for example a coupon at the door)<\/td><td>A consented sample with ground-truth journeys<\/td><td>Small sample, needs shopper action<\/td><\/tr><tr><td>Existing store data: door counters, POS timestamps, Wi-Fi AP client counts<\/td><td>Free anchors for entry counts and checkout matching<\/td><td>Coarse, store-wide<\/td><\/tr><\/tbody><\/table><p>Cheapest and most useful for a hackathon: a few <strong>shelf PIR sensors on an ESP32<\/strong>. They give independent ground truth for was someone at this section, and for how long, and they directly confirm dead zones: no PIR triggers plus no CCTV dwell is a very confident dead zone.<\/p>", "id": "addons"}, {"title": "Analytics model", "parent": "", "order": 4, "html": "<p>What we compute from tracks, and how we turn it into flags and recommendations.<\/p>", "id": "analytics"}, {"title": "Architecture", "parent": "pipeline", "order": 1, "html": "<pre>Camera / RTSP stream (or video file for the demo)\n  -&gt; frame grab, adaptive sampling, presence gate\n  -&gt; YOLO detection + ByteTrack/BoT-SORT tracking\n  -&gt; homography: pixels -&gt; floor-plan coordinates\n  -&gt; zone state machine (enter/exit, dwell, displacement)\n  -&gt; batched writes to SQLite/Postgres every few seconds\n  -&gt; rolling aggregates (decaying heat map, occupancy, 5-min zone stats)\n  -&gt; dashboard + alert/recommendation engine<\/pre>\n<p>Raw coordinates are kept (they are tiny) for week-over-week and before/after layout analysis.<\/p>\n<h4>Sensor-agnostic fusion layer<\/h4>\n<p>Make every sensor emit the same simple event: <code>(zone, time, count, confidence)<\/code>. CCTV, PIR, cart tags and checkout timestamps all become inputs to one fusion layer. Adding a sensor then means writing an adapter. The pitch becomes camera-first and sensor-agnostic instead of five separate integrations.<\/p>\n<h4>Proposed stack<\/h4>\n<p>Python, Ultralytics YOLO (nano or small), ByteTrack or BoT-SORT, OpenCV (<code>grab<\/code>/<code>retrieve<\/code>, <code>findHomography<\/code>), NumPy, SQLite or Postgres, Streamlit (or React), Plotly.<\/p>", "id": "arch"}, {"title": "Bottlenecks and throughput", "parent": "analytics", "order": 3, "html": "<p>The README rule, high occupancy plus low speed, also fires on happy browsers in a popular aisle. Make it stricter.<\/p>\n<ul><li>For chokepoints (checkout, entrance, narrow aisles) measure <strong>throughput<\/strong>: people crossing a virtual line per minute, alongside occupancy.<\/li><li>Estimate wait time with Little's law: occupancy divided by throughput. Example output: checkout queue, about 6 minutes estimated wait.<\/li><li>This separates a queue from a crowd and gives a metric a manager can act on.<\/li><li>Keep dwell and congestion apart using speed, displacement and crowd density.<\/li><\/ul><p>Raw Little's-law estimates need steady-state conditions, so treat them as indicative during surges.<\/p>", "id": "bottleneck"}, {"title": "Product branches", "parent": "", "order": 7, "html": "<p>Each branch answers who acts on the output and what they do next. Pick one spine and one supporting branch. Trying all five gives a wide, shallow demo.<\/p>\n<table><thead><tr><th>Branch<\/th><th>Intent<\/th><th>Demo moment<\/th><th>Main risk<\/th><\/tr><\/thead><tbody><tr><td>1. Store manager's diagnostician<\/td><td>Tell a manager why a section underperforms and what to try, in plain language<\/td><td>Aisle 4 end-cap: visits 35% below usual, dwell normal, so people are not seeing it. Move signage.<\/td><td>Recommendations feel generic without concrete rules; needs baseline history, so seed it<\/td><\/tr><tr><td>2. Layout experiment engine<\/td><td>Turn we moved the display into measured evidence, normalized for total traffic<\/td><td>Two clips of one mock store with a display moved: +22% visits to the promo zone after normalizing<\/td><td>Needs a consistent camera and two comparable recordings<\/td><\/tr><tr><td>3. Live operations console<\/td><td>Real-time awareness: checkout wait is about 6 min, open another counter<\/td><td>A queue builds in the clip and an alert fires early<\/td><td>Closest to existing vendors; depends on tracking in crowds<\/td><\/tr><tr><td>4. Conversion funnel<\/td><td>Split each zone into passed, stopped, bought so managers know which fix applies<\/td><td>Two zones with equal sales and very different funnels<\/td><td>POS data is mocked, so judges may discount it<\/td><\/tr><tr><td>5. Privacy-first edge kit<\/td><td>Deployable by a small retailer: cheap hardware, existing cameras, under an hour<\/td><td>Calibrating a new camera live in a couple of minutes<\/td><td>Setup UX is easy to underinvest in; weak if analytics beneath are shallow<\/td><\/tr><\/tbody><\/table>\n<h4>Combinations<\/h4>\n<table><thead><tr><th>Spine<\/th><th>Best supporting branch<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td>Branch 2 (experiments)<\/td><td>Branch 1 (diagnostician)<\/td><td>Measure the change, then explain it<\/td><\/tr><tr><td>Branch 1 (diagnostician)<\/td><td>Branch 4 (funnel)<\/td><td>Explanations sharpen when you can say stopped but did not buy<\/td><\/tr><tr><td>Branch 3 (live ops)<\/td><td>Branch 5 (edge kit)<\/td><td>A real-time story only works if it is cheap to deploy<\/td><\/tr><\/tbody><\/table>\n<h4>Current recommendation<\/h4>\n<p><strong>Branch 2 as the spine, Branch 1 as support.<\/strong> Existing tools show a heat map, but few say whether a change worked. It is very demoable, since you control both layouts in a mock store and have ground truth. Branch 1's explanations make the result readable to a non-technical manager. It also has a business model: suppliers who pay for display space want proof of exposure.<\/p>\n<p>Branch 3 is the safest if time is short, but is easiest to dismiss as RetailNext but worse.<\/p>\n<p>Before and after comparison must be normalized for total store traffic, otherwise a busy Saturday looks like a successful move.<\/p>", "id": "branches"}, {"title": "The brief", "parent": "overview", "order": 1, "html": "<p>Problem statement 3.<\/p>\n<blockquote>Physical retail stores struggle to measure which store sections attract long browsing times versus areas that block traffic or are ignored completely. Optimizing a store's layout, promotional display placement, and traffic flow directly impacts revenue and customer satisfaction. By utilizing existing, standard in-store security cameras, computer vision can unlock deep operational insights, transforming raw video feeds into actionable heat maps and flow metrics.<\/blockquote>\n<h4>The ask<\/h4>\n<p>Design and build an intelligent computer vision solution that processes standard in-store camera feeds to:<\/p>\n<ul><li>map customer journeys<\/li><li>generate real-time foot-traffic heat maps<\/li><li>calculate precise section-by-section dwell times<\/li><li>automatically flag layout bottlenecks or dead zones<\/li><\/ul><p>The brief names existing cameras explicitly, so anything that needs new hardware reads as optional.<\/p>", "id": "brief"}, {"title": "Build plan", "parent": "", "order": 9, "html": "<ol><li>Detect and track people on a sample video and draw IDs<\/li><li>Homography and floor-plan plotting<\/li><li>Zones and dwell times<\/li><li>Heat map<\/li><li>Bottleneck and dead-zone logic<\/li><li>Dashboard and recommendations<\/li><li>Demo polish<\/li><\/ol><p>The right cut depends on hackathon length and team size. See Open questions.<\/p>", "id": "build"}, {"title": "Checkout attribution", "parent": "identity", "order": 4, "html": "<p>The cleanest identity anchors in a store are the entrance and the register. A party seen at a checkout lane at a given time can be matched to the POS transaction timestamp, with no phone or tag.<\/p>\n<h4>Retroactive value attribution<\/h4>\n<ol><li>Track the walker anonymously through the store with a short-lived track.<\/li><li>At the register, match the party to the POS transaction by timestamp and lane.<\/li><li>Attribute the basket value back to the path they took.<\/li><\/ol>\n<p>Heat maps can then be weighted by <strong>revenue per visitor<\/strong> instead of footfall. Examples: shoppers who passed through zone C spent 30% more on average, or this aisle gets traffic but high spenders skip it.<\/p>\n<h4>Limits<\/h4>\n<ul><li>Needs an unambiguous match, so queue overlap hurts.<\/li><li>Correlation, not causation.<\/li><li>Needs a POS timestamp feed, mocked in the demo.<\/li><li>Browsers who buy nothing never match. You still get their path and dwell, which is the visited-but-did-not-buy group.<\/li><li>Requires a register visible in frame. Check the footage before committing.<\/li><\/ul>", "id": "checkout"}, {"title": "Positioning comparison", "parent": "sensors", "order": 2, "html": "<h3>Table 1: capability<\/h3>\n<table><thead><tr><th>Approach<\/th><th>Covers token-less, phone-less walkers?<\/th><th>Typical position accuracy<\/th><th>Identity persistence<\/th><th>Metal shelf / occlusion<\/th><th>Real-time?<\/th><\/tr><\/thead><tbody><tr><td>Mobile GPS<\/td><td>Only app users; GPS fails indoors<\/td><td>Poor indoors (tens of metres)<\/td><td>Strong, if opted in<\/td><td>Very poor<\/td><td>Yes<\/td><\/tr><tr><td>Passive Wi-Fi/BLE sniffing<\/td><td>Only people carrying a phone<\/td><td>2-5 m (RSSI), worse near metal<\/td><td>Weak (MAC randomization)<\/td><td>Poor<\/td><td>Yes<\/td><\/tr><tr><td>In-app BLE beacon positioning<\/td><td>Only app users<\/td><td>1-3 m with dense beacons<\/td><td>Strong<\/td><td>Moderate<\/td><td>Yes<\/td><\/tr><tr><td>Existing CCTV + CV<\/td><td><strong>Yes<\/strong><\/td><td>About 0.5-1 m in central view, worse at distance and when occluded<\/td><td>Short tracks, stitching needed<\/td><td>Occlusion is the main weakness<\/td><td>Yes<\/td><\/tr><tr><td>Overhead stereo cameras (RetailNext-style)<\/td><td><strong>Yes<\/strong><\/td><td>About 0.2-0.5 m<\/td><td>Short tracks<\/td><td>Low occlusion<\/td><td>Yes<\/td><\/tr><tr><td>Passive RFID checkpoint tokens<\/td><td>Only token holders<\/td><td>Zone-level, at reader points<\/td><td>Strong at read points<\/td><td>UHF hurt by metal and bodies<\/td><td>Yes<\/td><\/tr><tr><td>Offline IMU logger token<\/td><td>Only token holders<\/td><td>Drifts, needs landmark correction<\/td><td>Strong per token<\/td><td>Immune to metal (no signal needed)<\/td><td><strong>No<\/strong>, data arrives after exit<\/td><\/tr><tr><td>Shelf PIR / ToF sensors<\/td><td><strong>Yes<\/strong>, anonymously<\/td><td>Per-shelf presence<\/td><td>None<\/td><td>Little occlusion<\/td><td>Yes<\/td><\/tr><tr><td>mmWave radar<\/td><td><strong>Yes<\/strong>, anonymously<\/td><td>Presence and counting by area<\/td><td>None<\/td><td>Reflections off metal need testing<\/td><td>Yes<\/td><\/tr><tr><td>POS checkout match<\/td><td>Only at checkout<\/td><td>n/a (a timestamp anchor)<\/td><td>Strong at one point<\/td><td>n/a<\/td><td>Yes<\/td><\/tr><\/tbody><\/table><h3>Table 2: practical fit<\/h3><table><thead><tr><th>Approach<\/th><th>Bias introduced<\/th><th>Privacy / legal risk<\/th><th>Setup cost<\/th><th>Fits the brief?<\/th><\/tr><\/thead><tbody><tr><td>Mobile GPS / app<\/td><td>Heavy: app installers only<\/td><td>High (consent, DPDP)<\/td><td>App development<\/td><td>No<\/td><\/tr><tr><td>Passive Wi-Fi/BLE<\/td><td>Phone carriers only<\/td><td>High<\/td><td>Low to moderate<\/td><td>No<\/td><\/tr><tr><td>CCTV + CV<\/td><td>Low<\/td><td>Low if no video stored<\/td><td>Low (hardware exists)<\/td><td><strong>Yes<\/strong><\/td><\/tr><tr><td>Overhead stereo<\/td><td>Low<\/td><td>Low<\/td><td>High (new hardware)<\/td><td>No<\/td><\/tr><tr><td>Passive RFID tokens<\/td><td>Compliance and loss<\/td><td>Moderate<\/td><td>Moderate<\/td><td>No<\/td><\/tr><tr><td>IMU logger tokens<\/td><td>Compliance and loss<\/td><td>Moderate<\/td><td>Moderate to high<\/td><td>No<\/td><\/tr><tr><td>Shelf PIR<\/td><td>None<\/td><td>Very low<\/td><td>Low per unit<\/td><td>Partly (add-on)<\/td><\/tr><tr><td>mmWave<\/td><td>None<\/td><td>Very low<\/td><td>Moderate<\/td><td>Partly (add-on)<\/td><\/tr><tr><td>POS match<\/td><td>Purchasers only<\/td><td>Low<\/td><td>Low (data feed)<\/td><td>Yes (data source)<\/td><\/tr><\/tbody><\/table>", "id": "compare"}, {"title": "How stores cope today", "parent": "overview", "order": 3, "html": "<table><thead><tr><th>Method<\/th><th>Limitation<\/th><\/tr><\/thead><tbody><tr><td>Clipboard observation, staff intuition<\/td><td>Small sample, biased, not continuous<\/td><\/tr><tr><td>Watching CCTV by eye<\/td><td>Slow, does not scale<\/td><\/tr><tr><td>POS / loyalty analysis<\/td><td>Lagging and indirect; cannot separate no visits from no purchase<\/td><\/tr><tr><td>Door counters<\/td><td>Store-wide only, nothing per section<\/td><\/tr><tr><td>Layout rules of thumb, A/B moves<\/td><td>Generic, slow, confounded by seasons and promos<\/td><\/tr><tr><td>Paid vendors (RetailNext, Hikvision/Hanwha analytics, Flowix, V-Count, others)<\/td><td>Costly, hardware- or brand-tied, often stop at dashboards<\/td><\/tr><\/tbody><\/table>", "id": "coping"}, {"title": "Multi-camera deduplication", "parent": "identity", "order": 2, "html": "<p>Position first, appearance second.<\/p>\n<h4>Overlapping cameras<\/h4>\n<p>Project every detection onto the shared floor plan with time-synced frames. If two cameras report a person within about 0.5-1 m at the same moment, treat them as one, using assignment matching (Hungarian algorithm) on a distance cost. No face or appearance model needed.<\/p>\n<h4>Non-overlapping cameras<\/h4>\n<ul><li>Use a handoff zone where one camera's exit area meets the next camera's entry area, plus time gating (someone leaves A toward B, and someone appears in B within 10 seconds).<\/li><li>Add a clothing-appearance embedding (never faces) only as a tiebreaker, kept in memory for the visit and deleted on exit.<\/li><\/ul>\n<h4>Single camera still needs stitching<\/h4>\n<p>A track that breaks and restarts after an occlusion creates a second person. Short-gap stitching (same area, similar velocity, gap under a few seconds) is simpler than cross-camera matching and still necessary.<\/p>", "id": "dedupe"}, {"title": "Demo and data", "parent": "build", "order": 2, "html": "<p>A 5-10 minute clip (public footage or a taped-off mock store), fed through the same streaming loop and throttled to real time. Only the source URL changes for a real camera.<\/p>\n<h4>Minimum scene<\/h4>\n<ul><li>A checkout lane in frame, if the revenue-per-path feature is to be built rather than described.<\/li><li>At least two zones with different product types, for the dwell-versus-purchase split.<\/li><li>A mock POS basket file where each item carries a section tag.<\/li><li>Two layouts of the same space, if Branch 2 is the spine.<\/li><li>Scripted actors for browsing, directed shopping and waiting.<\/li><\/ul>", "id": "demo"}, {"title": "Gaps we target", "parent": "overview", "order": 4, "html": "<p>Six gaps were listed originally. That is too many to show well. Lead with the first three and use the rest as supporting lines.<\/p>\n<ol><li><strong>Dashboards, not decisions.<\/strong> Plain-language recommendations, not only charts.<\/li><li><strong>Absolute thresholds.<\/strong> Flag deviations relative to each zone's own category norm. A TV aisle with long dwell and few visits is normal, not a failure.<\/li><li><strong>Ambiguous dwell.<\/strong> Separate engagement from congestion using speed, displacement and crowding.<\/li><li><strong>Cost and setup.<\/strong> Runs on existing cameras with self-serve calibration (click floor points, draw zones).<\/li><li><strong>Privacy.<\/strong> No face recognition, no stored video, anonymous coordinates only.<\/li><\/ol>\n<h4>Sharper versions to pitch<\/h4>\n<ul><li>Relative flagging with an explanation, for example 40% below this zone's usual Friday-evening dwell.<\/li><li>Engagement versus congestion, defined by displacement, speed and crowd density.<\/li><li>Before and after layout comparison, normalized for total store traffic. This turns analytics into decisions.<\/li><\/ul>", "id": "gaps"}, {"title": "Groups and parties", "parent": "identity", "order": 3, "html": "<p>Infer parties by behaviour. Nobody has to carry anything.<\/p>\n<ul><li>Seed a party at the entrance, where people arrive together.<\/li><li>Keep the link while members stay within about 2 m with similar velocity.<\/li><li>Allow soft splits and merges. A child runs ahead, a parent goes to another aisle: membership stays, with a currently separated flag.<\/li><li>Count dwell per person (person-seconds). Count visits and conversion per party.<\/li><li>Group inference will sometimes be wrong, so show it as probable.<\/li><\/ul>\n<h4>If tokens must be linked within a group<\/h4>\n<ul><li><strong>Co-issuance:<\/strong> a staff tap or kiosk at the entrance assigns tokens a shared party ID (group of 4, 2 tokens).<\/li><li><strong>Token-to-token proximity logging:<\/strong> each token records nearby token IDs over time. Covers token holders only.<\/li><li><strong>Do not impute:<\/strong> a lost or unreturned token is a missing sample. Flag the visit as no token data and fall back to CCTV.<\/li><\/ul><p>Bags and carts are optional anchors that raise confidence, never the identity. A family with three bags is still one party. A cart parked at an aisle end is not dwell.<\/p>", "id": "groups"}, {"title": "Merging heatmaps", "parent": "identity", "order": 5, "html": "<p>Keeping sources separate and merging at the end is right. Weighting people who carry both a phone and a bag more heavily is not, because it biases the map toward big-basket shoppers with an app.<\/p>\n<h4>Better rule: weight by source reliability per location<\/h4>\n<ul><li>CCTV is the unbiased base since it sees everyone. Where it is weak (occluded corners, far from camera, poor light), give other sources more weight there.<\/li><li>Use people seen by both sources to <strong>calibrate<\/strong>, not to dominate. If carts are detected 30% less in back aisles because of metal shelving, learn that correction factor and apply it.<\/li><li>Normalize each source before merging. A cart heatmap shows where carts go, so scale it to all shoppers using the ratio of carts to CCTV-detected people per zone.<\/li><\/ul><p>Matched pairs double as an accuracy measurement: how far apart the two sources' positions are.<\/p>", "id": "heatmerge"}, {"title": "Homography and the floor map", "parent": "pipeline", "order": 3, "html": "<p>The weakest link in the geometry. A single homography assumes a flat floor and an undistorted image. Real CCTV is often wide-angle or fisheye, mounted at an angle, with shelves hiding feet. The bottom-centre of a bounding box is therefore a noisy floor point, and error grows with distance from the camera.<\/p>\n<h4>Plan<\/h4>\n<ul><li>Add lens undistortion, or at least a camera-model check.<\/li><li>Report accuracy as zone-level, not centimetre-level. That is honest and enough for dwell by zone.<\/li><\/ul>\n<h4>Getting the store map without a blueprint<\/h4>\n<p>Enterprise vendors usually get a CAD or PDF floor plan from the retailer and calibrate sensors against it. A mid-size store often has no clean plan, which makes self-serve calibration a real differentiator. Options:<\/p>\n<ol><li><strong>Draw it yourself:<\/strong> upload a photo or sketch, scale it with one known distance (door width, floor tile), and draw zones on it.<\/li><li><strong>Use the camera view as the map:<\/strong> define zones in image space and skip the metric plan. You lose cross-camera stitching but not dwell or heat maps.<\/li><li><strong>Measure and click:<\/strong> tape-measure 4+ floor points visible in the camera and compute the homography. This is what the README already proposes.<\/li><\/ol>", "id": "homography"}, {"title": "Identity and fusion", "parent": "", "order": 5, "html": "<p>Fuse at different levels, and only as deep as each metric needs. Do not try to build one unified identity.<\/p>\n<table><thead><tr><th>Metric<\/th><th>Needs identity?<\/th><\/tr><\/thead><tbody><tr><td>Heat map, zone occupancy, throughput<\/td><td>No, only detections at floor positions<\/td><\/tr><tr><td>Per-zone dwell<\/td><td>Only a short, reliable track per person<\/td><\/tr><tr><td>Zone-to-zone flow<\/td><td>Needs stitching across gaps<\/td><\/tr><tr><td>Conversion (dwell plus purchase)<\/td><td>Needs a party linked to a basket<\/td><\/tr><\/tbody><\/table>", "id": "identity"}, {"title": "Entity layers", "parent": "identity", "order": 1, "html": "<ol><li><strong>Track:<\/strong> a short fragment from one camera. The raw output.<\/li><li><strong>Person:<\/strong> tracks stitched across cameras and gaps.<\/li><li><strong>Party:<\/strong> people who shop together (a family, a couple).<\/li><li><strong>Visit:<\/strong> a party's full trip from entrance to checkout.<\/li><\/ol><p>Each level carries a confidence score. Report each analytic at the level it needs.<\/p><table><thead><tr><th>Layer<\/th><th>Unit<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td>Heat map, zone dwell, occupancy<\/td><td>Individual person<\/td><td>CCTV, which sees everyone including children and token-less members<\/td><\/tr><tr><td>Purchase attribution, conversion<\/td><td>Party<\/td><td>POS basket joined at checkout<\/td><\/tr><tr><td>Validation and calibration<\/td><td>Whoever carries a token<\/td><td>Tokens, as a sample only<\/td><\/tr><\/tbody><\/table>", "id": "layers"}, {"title": "Limitations and roadmap", "parent": "", "order": 10, "html": "<h4>Honest notes<\/h4>\n<ul><li>Occlusion and ID switches happen when people cross paths. We report this rather than hide it.<\/li><li>Single camera for the prototype. Multi-camera stitching is future work.<\/li><li>CCTV shows behaviour, not purchases. Conversion needs POS data, mocked in the demo.<\/li><li>Attribution from path to purchase is correlation, not causation.<\/li><li>Journeys are probable, not certain, and carry a confidence figure.<\/li><li>Commercial products exist. Our edge is affordability, privacy, relative flagging and actionable output.<\/li><\/ul><h4>Roadmap<\/h4><ul><li>Multi-camera fusion<\/li><li>POS and loyalty integration<\/li><li>Layout what-if simulation<\/li><li>Time-of-day comparisons<\/li><li>Engagement versus passing-by using head orientation<\/li><li>Optional anchors (tags, PIR, mmWave) that raise confidence without being required<\/li><\/ul>", "id": "limits"}, {"title": "Wanderers and loiterers", "parent": "analytics", "order": 5, "html": "<p>Some people enter for the free AC, to wait for a friend, or to browse casually. You cannot read intent, but you can see behaviour. The goal is to stop non-shoppers inflating dwell and to report them as their own segment.<\/p>\n<table><thead><tr><th>Signal<\/th><th>Browsing shopper<\/th><th>Loiterer or waiter<\/th><\/tr><\/thead><tbody><tr><td>Location of the stop<\/td><td>In front of merchandise<\/td><td>Near the entrance, seating, vents, windows or empty floor<\/td><\/tr><tr><td>Interaction<\/td><td>Reaches, picks up, turns toward shelves<\/td><td>Hands down, body faces the door or a phone<\/td><\/tr><tr><td>Movement<\/td><td>Stop-and-go pattern<\/td><td>One long stop, or slow pacing in a small area<\/td><\/tr><tr><td>Zone coverage<\/td><td>Several zones<\/td><td>One or two zones for the whole visit<\/td><\/tr><tr><td>Exit<\/td><td>Often via checkout<\/td><td>Leaves without purchase, or leaves with someone who just arrived<\/td><\/tr><\/tbody><\/table>\n<h4>Approaches, cheapest first<\/h4>\n<ol><li><strong>Zone typing:<\/strong> tag zones as merchandise, circulation, seating or entrance. A 10-minute stop in circulation counts as presence, not engagement.<\/li><li><strong>Two dwell metrics:<\/strong> presence dwell (time in zone) and engaged dwell (time stopped in a merchandise zone with an interaction signal).<\/li><li><strong>Pose-based interaction:<\/strong> arm extension toward a shelf and body orientation from a pose model. Test on your footage first, since accuracy drops at low resolution and steep angles.<\/li><li><strong>Visit-level segmentation:<\/strong> soft, confidence-scored labels: engaged shopper, pass-through, loiterer or waiter, possible staff.<\/li><li><strong>Time-of-day correlation:<\/strong> a loiterer spike in the afternoon heat is itself the free-AC finding.<\/li><\/ol>\n<h4>Why it is an asset<\/h4>\n<ul><li>Wanderers who buy juice or chocolate are still revenue. Keep them as a segment, not noise. Impulse purchases near checkout are a finding.<\/li><li>Conversion among engaged visitors is more honest than conversion over all visitors.<\/li><li>A crowd lingering at the entrance may be blocking flow to the first display, which is a bottleneck by our own definition.<\/li><\/ul><h4>Boundaries<\/h4><ul><li>Labels carry confidence scores. Someone resting, comparing slowly, or moving carefully can look like a loiterer.<\/li><li>Aggregates only. Never an alert about an individual.<\/li><li>Thresholds are configurable, since a furniture store differs from a grocery store.<\/li><\/ul>", "id": "loiter"}, {"title": "Visits by dwell", "parent": "analytics", "order": 1, "html": "<table><thead><tr><th><\/th><th>Low dwell<\/th><th>High dwell<\/th><\/tr><\/thead><tbody><tr><td><strong>High visits<\/strong><\/td><td>Pass-through zone: good for impulse items and promos<\/td><td>Hot, engaged zone: protect it<\/td><\/tr><tr><td><strong>Low visits<\/strong><\/td><td>Dead zone: relocate, redesign, or fix signage<\/td><td>Destination zone (for example TVs): needs seating, demos, staff<\/td><\/tr><\/tbody><\/table>\n<p>Add conversion (dwell plus POS) to tell engagement from confusion, and speed plus crowd density to tell engagement from congestion.<\/p>", "id": "matrix"}, {"title": "MVP cut", "parent": "build", "order": 1, "html": "<table><thead><tr><th>Tier<\/th><th>Items<\/th><\/tr><\/thead><tbody><tr><td>Must have<\/td><td>Detect and track, homography, zones with dwell, decaying heat map, one bottleneck rule (checkout throughput), one relative dead-zone rule with a plain-language flag<\/td><\/tr><tr><td>If time allows<\/td><td>Before and after comparison, Sankey, staff filtering, LLM store-manager brief, mission segmentation, two dwell metrics (presence and engaged), loiterer segment<\/td><\/tr><tr><td>Pitch only<\/td><td>Multi-camera fusion, POS integration beyond a mock, what-if simulation, tokens and BLE, appearance Re-ID<\/td><\/tr><\/tbody><\/table>\n<h4>Tiers for identity work<\/h4>\n<ol><li><strong>Tier 0:<\/strong> per-camera tracking, floor coordinates, zone dwell, heat map.<\/li><li><strong>Tier 1:<\/strong> dedupe across overlapping cameras by spatial gating.<\/li><li><strong>Tier 2:<\/strong> party clustering by co-movement, with confidence.<\/li><li><strong>Tier 3:<\/strong> BLE anchors, POS time-matching, appearance Re-ID. Pitch only unless time allows.<\/li><\/ol><p>A single camera, or two overlapping ones, with Tiers 0-2 and a measured accuracy slide beats a five-source fusion that was never validated.<\/p>", "id": "mvp"}, {"title": "Overview", "parent": "", "order": 1, "html": "<p>Working notes for the hackathon problem <strong>Dwell-Time &amp; Bottleneck Mapper<\/strong>. Each tab holds one thread of the discussion. Add sub-tabs as ideas branch, and mark what is decided versus still open.<\/p>\n<blockquote>Online stores have analytics. Physical stores have guesswork. We fix that using cameras they already own.<\/blockquote>\n<h3>Where things stand<\/h3>\n<ul><li><strong>Base sensor:<\/strong> existing CCTV, camera-first and sensor-agnostic.<\/li><li><strong>Design constraint:<\/strong> the system must give useful output for a shopper who carries nothing and identifies nothing.<\/li><li><strong>Analytical core:<\/strong> attention (dwell) and outcome (purchase) are separate variables, moderated by shopper mission.<\/li><li><strong>Leading product direction:<\/strong> layout experiment engine as the spine, with the diagnostician as support (see Product branches).<\/li><li><strong>Blocking unknowns:<\/strong> hackathon length, team size, footage, camera angle, whether a checkout is in frame (see Open questions).<\/li><\/ul>", "id": "overview"}, {"title": "Footstep paths", "parent": "identity", "order": 6, "html": "<p>Dotted paths from the entrance across sections, with density.<\/p>\n<ul><li><strong>Space dots by time, not distance.<\/strong> One dot every 2 seconds. Wide spacing means walking, tight clusters mean browsing, so dwell is visible without a separate chart.<\/li><li><strong>Smooth before drawing.<\/strong> Raw positions jitter. A Kalman or similar smoother makes paths look intentional.<\/li><li><strong>Do not draw everything at once.<\/strong> Past 20-30 paths it turns to spaghetti. Show a sample of individual journeys plus an aggregated flow layer where thickness or opacity encodes how many people took the route.<\/li><li><strong>Filters:<\/strong> time of day, party, paths that visited zone X.<\/li><li>Label output as probable journeys with a confidence figure.<\/li><\/ul>", "id": "paths"}, {"title": "Phones and Bluetooth", "parent": "sensors", "order": 3, "html": "<h4>Why phones are dropped as an identity source<\/h4>\n<ul><li>GPS does not work reliably indoors.<\/li><li>Modern iOS and Android randomize Wi-Fi and BLE MAC addresses, so passive sniffing cannot give a persistent identity.<\/li><li>A person may carry several devices. Several people may share one, or leave devices behind.<\/li><li>Signal strength and visibility vary, and metal shelving blocks Bluetooth.<\/li><li>Collecting device identifiers raises privacy concerns and needs consent under the DPDP Act.<\/li><li>The only reliable route is an opt-in app, which most walk-in shoppers will not install.<\/li><\/ul><p>At most, keep phones as a crowd-density hint. Put this limitation section in the README.<\/p>", "id": "phones"}, {"title": "Pipeline", "parent": "", "order": 3, "html": "<p>How raw camera frames become floor coordinates, zones and metrics. Sub-tabs cover each stage and where it is fragile.<\/p>", "id": "pipeline"}, {"title": "Design principles", "parent": "", "order": 2, "html": "<p>Decisions that should survive every later change of mind.<\/p>\n<ul><li>The system must produce useful output for a shopper who carries nothing and identifies nothing.<\/li><li>CCTV is the base. Every other sensor is an optional layer that raises confidence or validates accuracy.<\/li><li>Report each metric at the unit it needs: individual, party or sample.<\/li><li>Show confidence on anything inferred (journeys, parties, loiterer labels). Say probable, never certain.<\/li><li>Aggregates only. Nothing that singles out a person.<\/li><\/ul>", "id": "principles"}, {"title": "Privacy and video handling", "parent": "principles", "order": 2, "html": "<h4>Never store the video<\/h4>\n<p>Video is a means, not the product. Process the live stream (RTSP) frame by frame and keep only <code>(track_id, timestamp, x, y)<\/code>. About 300 GB per week becomes a few MB.<\/p>\n<h4>Stance<\/h4>\n<ul><li>No face recognition. No stored video. Anonymous coordinates only.<\/li><li>Track IDs are short-lived and deleted after the visit. No repeat-visitor identity across days, by design.<\/li><li>Collecting phone identifiers needs consent under India's DPDP Act, which is another reason to drop phones as an identity source.<\/li><li>Edge processing is a pitch line that supports the main features, not a feature of its own.<\/li><li>Loiterer or staff labels are aggregate analytics only. A suspicious person alert would turn the tool into surveillance.<\/li><\/ul>", "id": "privacy"}, {"title": "Problem and who feels it", "parent": "overview", "order": 2, "html": "<p>Physical retailers know <strong>what sold<\/strong> (POS) and roughly <strong>how many came in<\/strong> (door counter). They do not know what happens in between:<\/p>\n<ul><li>Which sections do shoppers browse, and which do they walk past?<\/li><li>Where do people get stuck, queue, or turn back?<\/li><li>Is that promo display being seen at all?<\/li><\/ul>\n<p>Sales data shows <em>that<\/em> a section underperforms, not <em>why<\/em>. Nobody came? They came but did not stop? They stopped but did not buy? Each needs a different fix.<\/p>\n<h4>Who feels it<\/h4>\n<p>Store and operations managers, merchandisers and category managers, store planners, and suppliers who pay for display space. Mid-size retailers feel it most: they cannot afford enterprise tools but have outgrown guesswork.<\/p>", "id": "problem"}, {"title": "Open questions", "parent": "", "order": 11, "html": "<p>Answers here decide what is built and what stays a design slide.<\/p>\n<table><thead><tr><th>Question<\/th><th>Why it matters<\/th><th>Answer<\/th><\/tr><\/thead><tbody><tr><td>How long is the hackathon, and how many people are on the team?<\/td><td>Sets the line between must-build and pitch-only<\/td><td>Not yet known<\/td><\/tr><tr><td>Is there candidate footage? What is the camera angle and lens?<\/td><td>Decides calibration difficulty and whether homography is workable<\/td><td>Not yet known<\/td><\/tr><tr><td>Does the footage include a checkout, and how many cameras overlap?<\/td><td>Decides if revenue-per-path and Tier 1 dedupe are built or described<\/td><td>Not yet known<\/td><\/tr><tr><td>Record a mock store or use public clips?<\/td><td>Mock store gives ground truth and two comparable layouts<\/td><td>Not yet known<\/td><\/tr><tr><td>Does anyone have embedded hardware experience, and are ESP32 boards available?<\/td><td>Decides if PIR or token validation is realistic<\/td><td>Not yet known<\/td><\/tr><tr><td>Which branch is the spine?<\/td><td>Shapes MVP, demo and pitch<\/td><td>Leaning Branch 2 with Branch 1<\/td><\/tr><\/tbody><\/table>", "id": "questions"}, {"title": "Relative flagging", "parent": "analytics", "order": 4, "html": "<p>The strongest differentiator, and it has a cold-start problem: a zone's own norm needs history.<\/p>\n<h4>Fallback chain<\/h4>\n<ol><li>Category profile preset<\/li><li>Store-wide percentile<\/li><li>The zone's own time-of-day baseline once data accumulates<\/li><\/ol>\n<h4>Every flag explains itself<\/h4>\n<blockquote>Aisle 4 end-cap: visits 35% below usual Friday evening, dwell normal. People are not seeing it. Move the signage to sightline height.<\/blockquote>\n<p>For the demo, seed or simulate baseline history so the flags have something to compare against.<\/p>", "id": "relative"}, {"title": "RetailNext", "parent": "sensors", "order": 6, "html": "<blockquote>From general knowledge of their public material. Verify against their site before quoting it in a pitch.<\/blockquote>\n<h4>How they track foot traffic<\/h4>\n<ul><li><strong>Overhead sensors:<\/strong> ceiling-mounted video sensors, with stereo (two-lens) 3D cameras at entrances and key areas. Depth makes counting from above far more reliable than a single wall camera.<\/li><li><strong>Sensor fusion:<\/strong> Wi-Fi and BLE signals from phones, RFID and POS data combined in one cloud platform.<\/li><li><strong>Dedicated hardware:<\/strong> accuracy comes from purpose-built, calibrated sensors.<\/li><\/ul>\n<h4>How they get the map<\/h4>\n<p>They mostly do not do it without a blueprint. The retailer supplies a CAD or PDF floor plan, installers place sensors on it and calibrate each to known points. For a chain this effort is amortized across many stores with one template.<\/p>\n<h4>Our gap<\/h4>\n<p>Comparable insight from cameras the store already owns, which were mounted for security, not measurement, with self-serve calibration for stores that have no clean floor plan.<\/p>", "id": "retailnext"}, {"title": "Sampling, fps and dwell", "parent": "pipeline", "order": 2, "html": "<h4>Sampling plan from the README<\/h4>\n<ul><li>Sample at 2-5 fps, adaptive: about 1 fps when empty, higher when busy.<\/li><li>Downscale to about 640 px and use a small YOLO model.<\/li><li>Always process the latest frame and drop stale ones if the pipeline falls behind.<\/li><\/ul>\n<h4>Do not skip frames by pixel change<\/h4>\n<p>A shopper standing still at a display barely changes pixels, and those are exactly the frames that carry dwell. Gate on person presence instead: a cheap detector at low rate with a hold time after the last person leaves. Or use background subtraction with a minimum blob size to ignore fans and screens.<\/p>\n<h4>Is low fps a problem?<\/h4>\n<ul><li>Dwell is measured in seconds, so it is robust.<\/li><li>Per-frame velocity is fragile. Compute speed over a 3-5 second window.<\/li><li>Define browsing by displacement: stays within a 1 m radius for 5+ seconds.<\/li><\/ul>\n<blockquote><strong>Open risk:<\/strong> 2-5 fps can break tracking. ByteTrack and BoT-SORT assume small motion between frames, and at 2 fps a walker moves about 0.6 m per frame. Either run the tracker at about 8-10 fps (the detector can stay cheap), or measure and report the ID-switch rate at the chosen fps.<\/blockquote>", "id": "sampling"}, {"title": "Sensor options", "parent": "", "order": 6, "html": "<p>Only CCTV, PIR, mmWave and overhead stereo can see the anonymous walker. Of those, only CCTV matches the brief and costs nothing in hardware. Everything that carries identity (phones, tokens) adds sampling bias, and everything with precise position (stereo, tokens) needs new hardware. That is why CCTV is the base and the rest are layers.<\/p>\n<blockquote>Accuracy figures in these tabs are typical ranges from general knowledge, not measurements. Validate them on your own footage before using them in a pitch.<\/blockquote>", "id": "sensors"}, {"title": "Alternative sources", "parent": "sensors", "order": 1, "html": "<table><thead><tr><th>Source<\/th><th>What it gives you<\/th><th>Trade-off<\/th><\/tr><\/thead><tbody><tr><td>Wi-Fi / Bluetooth sniffing<\/td><td>Rough device positions, repeat visits<\/td><td>Low accuracy (3-10 m), only phone owners, privacy and MAC randomization<\/td><\/tr><tr><td>BLE beacons / app positioning<\/td><td>Accurate location for app users<\/td><td>Only works for customers who installed the app<\/td><\/tr><tr><td>Overhead people-counting sensors (thermal, time-of-flight, stereo)<\/td><td>Very accurate counts at entrances and aisle ends<\/td><td>Hardware cost, counts only, no journeys<\/td><\/tr><tr><td>Smart carts / baskets (RFID or UWB)<\/td><td>Precise paths and dwell, linked to cart contents<\/td><td>Needs special carts<\/td><\/tr><tr><td>POS / loyalty data<\/td><td>What was bought, when, basket composition<\/td><td>Nothing about behaviour before purchase<\/td><\/tr><tr><td>Door counters<\/td><td>Total footfall<\/td><td>Nothing inside the store<\/td><\/tr><tr><td>Shelf / weight sensors<\/td><td>Pick-up events at product level<\/td><td>Expensive, installed per shelf<\/td><\/tr><\/tbody><\/table>", "id": "sources"}, {"title": "Tokens and carts", "parent": "sensors", "order": 4, "html": "<h4>Cart or bag tags<\/h4>\n<ul><li><strong>Better:<\/strong> persistent identity, no occlusion, simpler privacy, works through shelves and blind spots (for Bluetooth, within limits).<\/li><li><strong>Worse:<\/strong> selection bias (many shoppers carry nothing), a cart is not a person (parked carts fake dwell), RSSI error of 2-5 m, still needs a store map, cost and battery upkeep, and it is off-brief.<\/li><\/ul>\n<h4>The physical token handed out at the door<\/h4>\n<p>GPS will not work indoors. A copper coil alone is an antenna as in RFID or NFC: passive, no memory, only responds near a reader. Two workable versions:<\/p>\n<table><thead><tr><th>Version<\/th><th>How it works<\/th><th>Strength<\/th><th>Weakness<\/th><\/tr><\/thead><tbody><tr><td>A. Checkpoint tags (passive RFID)<\/td><td>Readers at zone or aisle entrances log each token as it passes<\/td><td>Cheap, no batteries, exact zone sequence<\/td><td>Dwell only inferred between reads; metal and bodies interfere with UHF<\/td><\/tr><tr><td>B. Offline logger (battery, IMU, flash)<\/td><td>Records steps and heading by dead reckoning; a scanner dumps and resets it at exit<\/td><td>No receivers in store, emits nothing<\/td><td>Drift needs landmark correction, orientation changes in a pocket, no real-time heat map<\/td><\/tr><\/tbody><\/table>\n<h4>Why it struggles for the baseline shopper<\/h4>\n<ul><li>Compliance bias: people refuse, forget, drop it in a basket, or leave with it.<\/li><li>Entrance friction, hygiene and staffing cost.<\/li><li>Hardware pool, charging, loss and damage. Even at a few hundred rupees per unit it adds up.<\/li><li>Off-brief, since the statement asks for existing cameras.<\/li><li>A token tied to a person at the door is still a per-visit identifier, so consent and a reset policy are needed.<\/li><li>Children cannot hold tokens, so one family produces one token for several people.<\/li><\/ul>\n<h4>Where it is genuinely useful<\/h4>\n<ol><li><strong>Ground truth for the accuracy slide.<\/strong> Give tokens to 10-15 friends in the mock-store recording and compare logged paths with CCTV tracks.<\/li><li><strong>Checkout linking<\/strong> for token holders, making revenue-per-path exact for that sample.<\/li><li><strong>Premium upgrade tier:<\/strong> works on existing cameras alone and gets sharper with optional tokens.<\/li><\/ol><p>Recommendation: keep camera-only as the product. Treat tokens as validation and a roadmap item. Building Version B takes real firmware work (an ESP32-class board with an IMU, offline logging and a reader script).<\/p>", "id": "tokens"}, {"title": "Tracking risks", "parent": "pipeline", "order": 4, "html": "<table><thead><tr><th>Risk<\/th><th>What goes wrong<\/th><th>Handling<\/th><\/tr><\/thead><tbody><tr><td>Low fps<\/td><td>IoU association gets shaky, IDs fragment when people cross<\/td><td>Run tracker at about 8-10 fps, or report ID-switch rate<\/td><\/tr><tr><td>Occlusion<\/td><td>A track breaks and restarts, creating a second person and inflating counts and dwell<\/td><td>Short-gap stitching: same area, similar velocity, gap under a few seconds<\/td><\/tr><tr><td>Staff<\/td><td>Stocking shelves or standing at counters creates huge fake dwell<\/td><td>Staff-only zones, flag implausibly long or looping tracks, optional coarse uniform cue<\/td><\/tr><tr><td>Children and groups<\/td><td>A family of four is one shopping unit but four tracks<\/td><td>State the counting unit: individuals for dwell, parties for conversion<\/td><\/tr><tr><td>Full journeys<\/td><td>Track fragmentation breaks entrance-to-exit paths<\/td><td>Zone-sequence flows with stitching, labelled probable journeys with a confidence figure<\/td><\/tr><\/tbody><\/table>", "id": "tracking"}, {"title": "Attention, outcome and mission", "parent": "analytics", "order": 2, "html": "<p>Dwell measures <strong>attention<\/strong>. Purchase measures <strong>outcome<\/strong>. They are independent, and there is a hidden third variable: the shopper's <strong>mission<\/strong>.<\/p>\n<table><thead><tr><th><\/th><th>Low dwell<\/th><th>High dwell<\/th><\/tr><\/thead><tbody><tr><td><strong>High purchase<\/strong><\/td><td>Directed shopper with a list: knew what they wanted, grabbed it<\/td><td>Engaged and converted: the healthy case<\/td><\/tr><tr><td><strong>Low purchase<\/strong><\/td><td>Walked past: visibility problem<\/td><td>Interested but did not buy: price, stock, confusion or comparison shopping<\/td><\/tr><\/tbody><\/table>\n<p>A list-driven shopper has short dwell and high purchase. An explorer has long dwell and uncertain purchase. Averaging them hides both patterns.<\/p>\n<h4>Mission is inferable from camera data alone<\/h4>\n<ul><li><strong>Directed:<\/strong> direct paths, high walking speed between zones, few stops, short visit.<\/li><li><strong>Exploratory:<\/strong> meandering paths, many stop-and-go episodes, backtracking, longer visit.<\/li><\/ul>\n<p>Compute the dwell-versus-purchase matrix <strong>per mission segment<\/strong>, not store-wide. Example finding: zone C converts well for directed shoppers, but explorers dwell and leave empty-handed.<\/p>\n<h4>Where purchase per zone comes from<\/h4>\n<p>POS baskets contain SKUs, and each SKU maps to a shelf zone. At checkout, match the party to a basket and ask, for each zone the party visited, whether the basket holds an item from it.<\/p>\n<ul><li>Visited the zone and bought from it: converted.<\/li><li>Visited and did not buy from it: browsed.<\/li><li>Did not visit but still bought from it: a tracking miss, or the item sits elsewhere. A useful data-quality check.<\/li><\/ul><p>Caveats: the SKU-to-zone map needs upkeep (items sit in several places), and attribution is correlation only. The join happens at party level.<\/p>", "id": "twovar"}, {"title": "Validation and accuracy", "parent": "", "order": 8, "html": "<p>Most hackathon CV demos show overlays and no accuracy numbers. One accuracy slide separates this project from those.<\/p>\n<h4>Plan<\/h4>\n<ol><li>Manually annotate 2-3 minutes of the clip: when each person enters and leaves each zone.<\/li><li>Report dwell error, count error and ID switches.<\/li><li>Record a taped-off mock store for ground truth and a controlled camera angle. Retail footage that is public is scarce.<\/li><li>Script friends to act out waiting and browsing so loiterer detection has ground truth.<\/li><li>Optional: give a few friends tokens or place shelf PIR sensors as independent ground truth.<\/li><li>State accuracy honestly as zone-level, not centimetre-level.<\/li><\/ol><h4>Metrics to report<\/h4><ul><li>Dwell error per zone (seconds and percent)<\/li><li>Count error at entrance and checkout<\/li><li>ID switches per minute at the chosen fps<\/li><li>Journey completeness (share of visits stitched entrance to checkout)<\/li><li>Mission and loiterer classification accuracy on scripted clips<\/li><\/ul>", "id": "validation"}, {"title": "The anonymous walker", "parent": "principles", "order": 1, "html": "<p>The target customer: no phone signal, no cart, no app, alone or in a party, free to wander, with a big wallet and no interest in being identified.<\/p>\n<h4>What can be observed about this person<\/h4>\n<ul><li>Where their body is on the floor, over time<\/li><li>How they move: speed, direction, stopping, turning back<\/li><li>Who they move with (co-movement)<\/li><li>Where and when they appear at the entrance and checkout<\/li><\/ul>\n<p>Everything useful must be derived from those four things.<\/p>\n<h4>Consequences<\/h4>\n<table><thead><tr><th>Decision<\/th><th>Choice<\/th><\/tr><\/thead><tbody><tr><td>Primary sensor<\/td><td>CCTV only. The full pipeline works with nothing else.<\/td><\/tr><tr><td>Identity<\/td><td>Short-lived tracks, stitched within a visit, deleted after.<\/td><\/tr><tr><td>Cross-camera matching<\/td><td>Floor position and timing first. Clothing appearance only as a tiebreaker, held in memory.<\/td><\/tr><tr><td>Parties<\/td><td>Inferred from co-movement from the entrance.<\/td><\/tr><tr><td>Dwell<\/td><td>Defined by displacement (stays within about 1 m for 5+ seconds), not by carrying anything.<\/td><\/tr><tr><td>PIR, BLE, tags<\/td><td>Optional confidence boosters or validation, never required.<\/td><\/tr><tr><td>Conversion<\/td><td>Checkout-time matching, not devices.<\/td><\/tr><\/tbody><\/table>\n<h4>Pitch framing<\/h4>\n<blockquote>We assume the hardest customer: someone who carries nothing, emits nothing, and just walks. If we can serve that shopper from cameras the store already owns, every other sensor is a bonus.<\/blockquote>", "id": "walker"}]</script>
<script>
(function(){
'use strict';
var raw=JSON.parse(document.getElementById('data').textContent);
var tabs=new Map(raw.map(function(t){t.text=t.html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').toLowerCase();return [t.id,t]}));
var $=function(s){return document.querySelector(s)};
var tree=$('#tree'),q=$('#q'),doc=$('#doc'),app=$('#app'),msg=$('#msg');
var active=null,collapsed=new Set();
var CHEV='<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 7 5 3 8.5"/></svg>';
function kids(p){return raw.filter(function(t){return t.parent===p}).sort(function(a,b){return a.order-b.order})}
function pathOf(id){var p=[],t=tabs.get(id);while(t){p.unshift(t.title);t=tabs.get(t.parent)}return p}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}

function renderTree(){
  var term=q.value.trim().toLowerCase(),vis=null;
  if(term){vis=new Set();raw.forEach(function(t){if(t.title.toLowerCase().indexOf(term)>-1||t.text.indexOf(term)>-1){var c=t;while(c){vis.add(c.id);c=tabs.get(c.parent)}}})}
  tree.replaceChildren();
  (function walk(parent,depth){
    kids(parent).forEach(function(t){
      if(vis&&!vis.has(t.id))return;
      var k=kids(t.id),open=vis?true:!collapsed.has(t.id),lead;
      if(k.length){lead=el('button','tog');lead.type='button';lead.setAttribute('aria-expanded',String(open));lead.setAttribute('aria-label',(open?'Collapse ':'Expand ')+t.title);lead.innerHTML=CHEV;
        lead.addEventListener('click',function(){collapsed.has(t.id)?collapsed.delete(t.id):collapsed.add(t.id);renderTree()})}
      else lead=el('span','spacer');
      var row=el('div','row'+(t.id===active?' on':'')+(depth===0?' top':''));
      row.style.setProperty('--d',depth);
      var b=el('button','name',t.title);b.type='button';b.title=t.title;
      b.addEventListener('click',function(){select(t.id);app.classList.remove('nav-open')});
      row.append(lead,b);tree.append(row);
      if(k.length&&open)walk(t.id,depth+1);
    });
  })('',0);
  if(!tree.children.length)tree.append(el('p','tree-empty','No tabs match that search.'));
  $('#count').textContent=raw.length+' tabs';
}
function select(id){
  if(!tabs.has(id))return;
  active=id;var t=tabs.get(id);
  $('#title').textContent=t.title;
  $('#crumb').textContent=pathOf(id).slice(0,-1).join('  /  ')||'Top-level tab';
  doc.innerHTML=t.html;
  document.title=t.title+' | Dwell-Time Ideation';
  try{history.replaceState(null,'','#'+id)}catch(e){}
  $('#scroll').scrollTop=0;renderTree();
}

/* ---- copy helpers: rich HTML so tables and headings paste cleanly into Google Docs ---- */
function shiftHeadings(root,by){
  root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function(h){
    var n=Math.min(6,+h.tagName[1]+by);if(n===+h.tagName[1])return;
    var r=document.createElement('h'+n);r.innerHTML=h.innerHTML;h.replaceWith(r);
  });
}
function tableAttrs(root){
  root.querySelectorAll('table').forEach(function(t){t.setAttribute('border','1');t.setAttribute('cellpadding','6');t.setAttribute('cellspacing','0');t.style.borderCollapse='collapse'});
  root.querySelectorAll('th').forEach(function(h){h.style.background='#EEF1F6'});
}
function sectionHtml(t,level,shift){
  var box=document.createElement('div');box.innerHTML=t.html;shiftHeadings(box,shift);tableAttrs(box);
  var h=document.createElement('h'+Math.min(level,6));h.textContent=t.title;
  return h.outerHTML+box.innerHTML;
}
function treeHtml(id,level){
  var t=tabs.get(id),out=sectionHtml(t,level,level-1);
  kids(id).forEach(function(k){out+=treeHtml(k.id,level+1)});
  return out;
}
function toPlain(html){var d=document.createElement('div');d.innerHTML=html;return d.innerText||d.textContent}
function flash(m){msg.textContent=m;clearTimeout(flash.t);flash.t=setTimeout(function(){msg.textContent=''},2600)}
function copyHtml(html){
  var plain=toPlain(html);
  function fallback(){
    var d=document.createElement('div');d.contentEditable='true';d.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';d.innerHTML=html;document.body.append(d);
    var r=document.createRange();r.selectNodeContents(d);var s=getSelection();s.removeAllRanges();s.addRange(r);
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    s.removeAllRanges();d.remove();flash(ok?'Copied. Paste into your Google Doc.':'Copy was blocked. Select the text and press Ctrl+C.');
  }
  if(navigator.clipboard&&window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})])
      .then(function(){flash('Copied. Paste into your Google Doc.')},fallback);
  }else fallback();
}
$('#copyTab').addEventListener('click',function(){copyHtml(sectionHtml(tabs.get(active),1,0))});
$('#copyTree').addEventListener('click',function(){copyHtml(treeHtml(active,1))});
$('#copyAll').addEventListener('click',function(){var h='';kids('').forEach(function(t){h+=treeHtml(t.id,1)});copyHtml(h)});
q.addEventListener('input',renderTree);
$('#menuBtn').addEventListener('click',function(){app.classList.add('nav-open')});
$('#scrim').addEventListener('click',function(){app.classList.remove('nav-open')});
window.addEventListener('hashchange',function(){var id=location.hash.slice(1);if(tabs.has(id)&&id!==active)select(id)});
var start=location.hash.slice(1);
select(tabs.has(start)?start:kids('')[0].id);
})();
</script>
</body>
</html>
